version: 2

project_name: soute

before:
  hooks:
    - go mod tidy

builds:
  - id: soute
    main: ./cmd/soute
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/zachicecreamcohn/soute/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - windows
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

# Homebrew tap (macOS). The target repo must exist under the given owner.
brews:
  - name: soute
    repository:
      owner: zachicecreamcohn
      name: homebrew-tap
    homepage: "https://github.com/zachicecreamcohn/soute"
    description: "Zero-friction project file versioning"
    license: MIT

# Scoop bucket (Windows). The target repo must exist under the given owner.
scoops:
  - name: soute
    repository:
      owner: zachicecreamcohn
      name: scoop-bucket
    homepage: "https://github.com/zachicecreamcohn/soute"
    description: "Zero-friction project file versioning"
    license: MIT

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
